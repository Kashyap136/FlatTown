# Render blueprint for the Flat Town API.
#
# Deploy from Render → New → Blueprint, pointing at this repository, or import
# `server/render.yaml` directly. Fill every `sync: false` value as a secret.
services:
  - type: web
    name: flattown-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_URL
        sync: false # e.g. https://flattown.vercel.app
      - key: BACKEND_URL
        sync: false # e.g. https://flattown-api.onrender.com
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: TIER_BUDGET
        value: 5000000
      - key: TIER_MID
        value: 15000000
      - key: COMMISSION
        value: 0.10
      - key: AGENT_PLATFORM_PERCENT
        value: 70
      # ---- secrets: set these in the Render dashboard ----
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ESCROW_ACCOUNT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # The simulated gateway can never be enabled in production; this is here
      # only so a misconfigured deploy fails loudly instead of silently mocking.
      - key: ALLOW_MOCK_PAYMENTS
        value: 'false'
      - key: MOCK_PAYMENT_KEY
        generateValue: true